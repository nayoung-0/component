<!--
    상품상세 스켈레톤 UI 마크업 (공용 컴포넌트)
    - 대응 CSS: css/product-detail-skeleton.css
    - 대응 JS : js/product-detail.custom.js > initDetailSkeleton()

    [삽입 위치]
    - 상품상세 실제 콘텐츠 루트(예: .xans-product-detail 또는
      #prdDetail 최상위) 바로 안쪽, 실제 콘텐츠보다 먼저 오도록 삽입.
    - 이 스니펫과 실제 콘텐츠가 "같은 부모의 형제" 관계여야
      product-detail-skeleton.css의 `~ *` 규칙이 정상 동작함.

    [document.documentElement.classList.add('has-detail-skeleton')]
    - layout.html 전역 페이지 로딩 opacity 처리와 중복 적용을
      막기 위한 마커 클래스. head/body 최상단에서 최대한 빨리
      실행되도록 이 스니펫과 함께 배치할 것 (FOUC 방지).
-->
<div class="product-detail-skeleton" aria-hidden="true">
    <div class="product-detail-skeleton__image"></div>
    <div class="product-detail-skeleton__info">
        <div class="product-detail-skeleton__line product-detail-skeleton__line--tag"></div>
        <div class="product-detail-skeleton__line product-detail-skeleton__line--name"></div>
        <div class="product-detail-skeleton__line product-detail-skeleton__line--name product-detail-skeleton__line--name-short"></div>
        <div class="product-detail-skeleton__line product-detail-skeleton__line--price"></div>
        <div class="product-detail-skeleton__line product-detail-skeleton__line--benefit"></div>
    </div>
</div>
<script>document.documentElement.classList.add('has-detail-skeleton');</script>
